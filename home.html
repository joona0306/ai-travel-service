<!doctype html>
<html lang="ko">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoamAI 홈</title>
  <link rel="stylesheet" href="css/style.css" />
 </head>
 <body>
  <div class="home-page" data-node-id="1406:301">
   <header class="home-header">
    <div class="home-header-inner">
     <a href="index.html" class="brand" aria-label="RoamAI 시작 화면">
      <span class="brand-mark">
       <img src="assets/icons/logo.png" alt="RoamAI 로고" />
      </span>
      <span class="brand-text">Roam<span class="brand-text-soft">AI</span></span>
     </a>
    </div>
   </header>

   <main class="home-main">
    <section class="home-hero">
     <h1 class="home-title">어디로 떠나볼까요?</h1>
     <p class="home-subtitle">원하는 여행 스타일을 알려주시면 AI가 맞춤 일정을 추천해 드릴게요.</p>
    </section>

    <section class="home-content">
     <section class="planner-card" aria-label="추천 일정 생성">
      <div class="planner-field planner-field-full">
       <label class="planner-label">목적지 또는 여행 분위기</label>
       <div class="planner-input">
        <img src="assets/icons/place-sm.png" alt="목적지 아이콘" />
        <span>예: 동남아 휴양지의 조용한 바다</span>
       </div>
      </div>

      <div class="planner-row">
       <div class="planner-field">
        <label class="planner-label">여행 기간</label>
        <div class="planner-input">
         <img src="assets/icons/calendar-md.png" alt="기간 아이콘" />
         <span>1주일</span>
        </div>
       </div>

       <div class="planner-field">
        <label class="planner-label">여행 인원</label>
        <div class="planner-input">
         <img src="assets/icons/people.png" alt="인원 아이콘" />
         <span>2명(커플)</span>
        </div>
       </div>
      </div>

      <a class="planner-submit" href="recommend.html" aria-label="추천 일정 생성하기">
       <img src="assets/icons/generate.png" alt="생성 아이콘" />
       <span>추천 일정 생성하기</span>
      </a>
     </section>

     <section class="destinations">
      <h2 class="destinations-title">인기 여행지</h2>

      <div class="destination-grid">
       <a href="recommend.html" class="destination-card" aria-label="일본 교토 추천 보기">
        <img src="assets/images/japan.png" alt="일본 교토" class="destination-image" />
        <div class="destination-overlay"></div>
        <div class="destination-meta">
         <div>
          <p class="destination-name">일본, 교토</p>
          <p class="destination-caption">클릭해서 추천받기</p>
         </div>
         <span class="destination-arrow">
          <img src="assets/icons/arrow-right-white.png" alt="" />
         </span>
        </div>
       </a>

       <a href="recommend.html" class="destination-card" aria-label="이탈리아 아말피 해안 추천 보기">
        <img src="assets/images/italy.png" alt="이탈리아 아말피 해안" class="destination-image" />
        <div class="destination-overlay"></div>
        <div class="destination-meta">
         <div>
          <p class="destination-name">이탈리아, 아말피 해안</p>
          <p class="destination-caption">클릭해서 추천받기</p>
         </div>
         <span class="destination-arrow">
          <img src="assets/icons/arrow-right-white.png" alt="" />
         </span>
        </div>
       </a>

       <a href="recommend.html" class="destination-card" aria-label="인도네시아 발리 추천 보기">
        <img src="assets/images/indonesia.png" alt="인도네시아 발리" class="destination-image" />
        <div class="destination-overlay"></div>
        <div class="destination-meta">
         <div>
          <p class="destination-name">인도네시아, 발리</p>
          <p class="destination-caption">클릭해서 추천받기</p>
         </div>
         <span class="destination-arrow">
          <img src="assets/icons/arrow-right-white.png" alt="" />
         </span>
        </div>
       </a>

       <a href="recommend.html" class="destination-card" aria-label="칠레 파타고니아 추천 보기">
        <img src="assets/images/chile.png" alt="칠레 파타고니아" class="destination-image" />
        <div class="destination-overlay"></div>
        <div class="destination-meta">
         <div>
          <p class="destination-name">칠레, 파타고니아</p>
          <p class="destination-caption">클릭해서 추천받기</p>
         </div>
         <span class="destination-arrow">
          <img src="assets/icons/arrow-right-white.png" alt="" />
         </span>
        </div>
       </a>

       <a href="recommend.html" class="destination-card" aria-label="프랑스 니스 추천 보기">
        <img src="assets/images/france.png" alt="프랑스 니스" class="destination-image" />
        <div class="destination-overlay"></div>
        <div class="destination-meta">
         <div>
          <p class="destination-name">프랑스, 니스</p>
          <p class="destination-caption">클릭해서 추천받기</p>
         </div>
         <span class="destination-arrow">
          <img src="assets/icons/arrow-right-white.png" alt="" />
         </span>
        </div>
       </a>

       <a href="recommend.html" class="destination-card" aria-label="스위스 체르마트 추천 보기">
        <img src="assets/images/swiss.png" alt="스위스 체르마트" class="destination-image" />
        <div class="destination-overlay"></div>
        <div class="destination-meta">
         <div>
          <p class="destination-name">스위스, 체르마트</p>
          <p class="destination-caption">클릭해서 추천받기</p>
         </div>
         <span class="destination-arrow">
          <img src="assets/icons/arrow-right-white.png" alt="" />
         </span>
        </div>
       </a>
      </div>
     </section>
    </section>
   </main>
  </div>
   <script src="js/script.js" defer></script>
 </body>
</html>

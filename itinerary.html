<!doctype html>
<html lang="ko">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoamAI 여행 일정</title>
  <link rel="stylesheet" href="css/style.css" />
 </head>
 <body>
  <div class="itinerary-page" data-node-id="1441:2654">
   <header class="app-header">
    <div class="app-header-inner">
     <div class="app-header-left">
      <a class="app-back" href="detail.html" aria-label="이전으로">
       <img src="assets/icons/back-black.png" alt="" />
      </a>
      <a class="app-brand" href="home.html" aria-label="RoamAI 홈">
       <span class="app-brand-mark"><img src="assets/icons/logo.png" alt="" /></span>
       <span class="app-brand-text">RoamAI</span>
      </a>
     </div>
     <a class="app-login" href="signin.html">
      <img src="assets/icons/login.png" alt="" />
      <span>로그인</span>
     </a>
    </div>
   </header>

   <main class="itinerary-main">
    <section class="itinerary-title-wrap">
     <div class="itinerary-title-left">
      <span class="itinerary-title-icon"><img src="assets/icons/send-lg.png" alt="" /></span>
      <div>
       <h1>네온사인 불빛과 고대 사원</h1>
       <p>전체 일정</p>
      </div>
     </div>
     <a href="#login-required" class="itinerary-favorite" aria-label="여행 저장">
      <img src="assets/icons/heart.svg" alt="" />
     </a>
    </section>

    <section class="itinerary-days" aria-label="일차 선택">
     <button type="button" class="itinerary-day is-active"><span>일차</span><strong>1</strong></button>
     <button type="button" class="itinerary-day"><span>일차</span><strong>2</strong></button>
     <button type="button" class="itinerary-day"><span>일차</span><strong>3</strong></button>
    </section>

    <section class="timeline-card">
     <h2>도착 & 도시 탐험</h2>

     <article class="timeline-item">
      <span class="timeline-dot"></span>
      <div class="timeline-content">
       <p class="timeline-time">10:00 AM</p>
       <div class="timeline-box">
        <span class="timeline-icon"><img src="assets/icons/coffee-sm.png" alt="" /></span>
        <div>
         <h3>호텔 체크인</h3>
         <p>짐을 풀고 휴식을 취하세요.</p>
        </div>
       </div>
      </div>
     </article>

     <article class="timeline-item">
      <span class="timeline-dot"></span>
      <div class="timeline-content">
       <p class="timeline-time">12:30 PM</p>
       <div class="timeline-box">
        <span class="timeline-icon"><img src="assets/icons/food.png" alt="" /></span>
        <div>
         <h3>현지 길거리 음식 투어</h3>
         <p>현지 전문가의 가이드를 받으며 현지 별미를 맛보세요.</p>
        </div>
       </div>
      </div>
     </article>

     <article class="timeline-item">
      <span class="timeline-dot"></span>
      <div class="timeline-content">
       <p class="timeline-time">04:00 PM</p>
       <div class="timeline-box">
        <span class="timeline-icon"><img src="assets/icons/city.png" alt="" /></span>
        <div>
         <h3>역사적인 도심 산책</h3>
         <p>구시가지와 주요 랜드마크를 둘러보세요.</p>
        </div>
       </div>
      </div>
     </article>
    </section>
   </main>

   <section id="login-required" class="login-modal-layer" aria-label="로그인 안내 모달">
    <a href="#" class="login-modal-backdrop" aria-label="모달 닫기"></a>
    <article class="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-modal-title">
     <div class="login-modal-head">
      <h2 id="login-modal-title">로그인 필요</h2>
      <a href="#" aria-label="모달 닫기"><img src="assets/icons/close-md.png" alt="" /></a>
     </div>
     <p>마음에 드는 여행을 저장하고 언제든지 다시 보려면 계정을 만들거나 로그인하세요.</p>
     <a href="signin.html" class="login-modal-cta">로그인하러 가기</a>
    </article>
   </section>
  </div>
   <script src="js/script.js" defer></script>
 </body>
</html>

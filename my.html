<!doctype html>
<html lang="ko">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoamAI 마이페이지</title>
  <link rel="stylesheet" href="css/style.css" />
 </head>
 <body>
  <div class="my-page" data-node-id="1441:3303">
   <header class="app-header my-header">
    <div class="app-header-inner">
     <div class="app-header-left">
      <a class="app-back" href="home.html" aria-label="홈으로">
       <img src="assets/icons/back-black.png" alt="" />
      </a>
      <a class="app-brand" href="home.html" aria-label="RoamAI 홈">
       <span class="app-brand-mark"><img src="assets/icons/logo.png" alt="" /></span>
       <span class="app-brand-text">RoamAI</span>
      </a>
     </div>
     <a class="my-profile-shortcut" href="my.html" aria-label="마이페이지">
      <img src="assets/icons/profile.png" alt="" />
     </a>
    </div>
   </header>

   <main class="my-main">
    <section class="my-profile-card">
     <div class="my-avatar">홍</div>
     <div class="my-profile-text">
      <h1>홍길동 님</h1>
      <p>hong@example.com</p>
     </div>
     <div class="my-profile-actions">
      <button type="button" class="my-mini-btn">
       <img src="assets/icons/setting-sm.png" alt="" />
       <span>설정</span>
      </button>
      <a href="index.html" class="my-mini-btn my-logout-btn">
       <img src="assets/icons/logout.png" alt="" />
       <span>로그아웃</span>
      </a>
     </div>
    </section>

    <section class="my-saved-heading">
     <img src="assets/icons/heart.svg" alt="" />
     <h2>저장된 여행 (2)</h2>
    </section>

    <section class="my-saved-grid" aria-label="저장된 여행 목록">
     <article class="trip-card">
      <a href="detail.html" class="trip-card-cover" aria-label="네온사인 불빛과 고대 사원 상세 보기">
       <img src="assets/images/japan.png" alt="네온사인 불빛과 고대 사원" />
       <span class="trip-heart is-filled"><img src="assets/icons/heart.svg" alt="" /></span>
       <span class="trip-chip-wrap">
        <span class="trip-chip">7일</span>
        <span class="trip-chip">200,000원</span>
       </span>
      </a>
      <div class="trip-card-body">
       <h3>네온사인 불빛과 고대 사원</h3>
       <p class="trip-location"><img src="assets/icons/place-xs.png" alt="" />일본, 도쿄</p>
       <p class="trip-reason">AI 추천: 빠른 템포의 도시 탐험과 깊이 있는 역사적 배경이 어우러져 "도시 & 문화" 취향에 딱 맞습니다.</p>
      </div>
     </article>

     <article class="trip-card">
      <a href="detail.html" class="trip-card-cover" aria-label="고요하고 영적인 휴식 상세 보기">
       <img src="assets/images/indonesia.png" alt="고요하고 영적인 휴식" />
       <span class="trip-heart is-filled"><img src="assets/icons/heart.svg" alt="" /></span>
       <span class="trip-chip-wrap">
        <span class="trip-chip">5일</span>
        <span class="trip-chip">1,300,000원</span>
       </span>
      </a>
      <div class="trip-card-body">
       <h3>고요하고 영적인 휴식</h3>
       <p class="trip-location"><img src="assets/icons/place-xs.png" alt="" />인도네시아, 우붓</p>
       <p class="trip-reason">AI 추천: 원하시는 여유로운 분위기에 완벽합니다. 웰니스 휴양지와 평화로운 환경이 풍부합니다.</p>
      </div>
     </article>
    </section>
   </main>
  </div>
   <script src="js/script.js" defer></script>
 </body>
</html>

<!doctype html>
<html lang="ko">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoamAI 온보딩 - 취향 선택</title>
  <link rel="stylesheet" href="css/style.css" />
 </head>
 <body>
  <div class="ob-page ob-pref">
   <header class="ob-header">
    <div class="ob-header-inner">
     <a href="index.html" class="ob-brand" aria-label="처음으로">
      <span class="ob-brand-mark"><img src="assets/icons/logo.png" alt="로고" /></span>
      <span class="ob-brand-text">Roam<span>AI</span></span>
     </a>
     <a href="signin.html" class="ob-login-link"><img src="assets/icons/login.png" alt="" />로그인</a>
    </div>
   </header>

   <main class="ob-main">
    <section class="ob-intro">
     <div class="ob-progress">
      <span class="is-active"></span><span></span><span></span>
     </div>
     <h1>어떤 여행 스타일을 좋아하시나요?</h1>
     <p>취향을 알려주시면 이후 추천과 일정 생성에 반영됩니다. 여러 개를 고를 수 있어요.</p>
    </section>

    <section class="ob-chip-grid" aria-label="여행 취향 선택">
     <button type="button" class="ob-chip is-selected"><span class="ob-check"></span><img src="assets/icons/food.png" alt="" />맛집 & 미식</button>
     <button type="button" class="ob-chip is-selected"><span class="ob-check"></span><img src="assets/icons/history-art.png" alt="" />역사 & 예술</button>
     <button type="button" class="ob-chip"><img src="assets/icons/adventure.png" alt="" />액티비티</button>
     <button type="button" class="ob-chip"><img src="assets/icons/mountain.png" alt="" />산 & 자연</button>
     <button type="button" class="ob-chip"><img src="assets/icons/city.png" alt="" />도시 & 문화</button>
     <button type="button" class="ob-chip"><img src="assets/icons/sun.png" alt="" />휴양 & 웰니스</button>
    </section>

    <section class="ob-actions">
     <a href="trip-setup.html" class="ob-next">다음</a>
     <a href="trip-setup.html" class="ob-skip">건너뛰기</a>
    </section>
   </main>
  </div>
   <script src="js/script.js" defer></script>
 </body>
</html>

<!doctype html>
<html lang="ko">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoamAI 온보딩 - 여행 설정</title>
  <link rel="stylesheet" href="css/style.css" />
 </head>
 <body>
  <div class="ob-page ob-setup">
   <header class="ob-header">
    <div class="ob-header-inner">
     <a href="index.html" class="ob-brand" aria-label="처음으로">
      <span class="ob-brand-mark"><img src="assets/icons/logo.png" alt="로고" /></span>
      <span class="ob-brand-text">Roam<span>AI</span></span>
     </a>
     <a href="signin.html" class="ob-login-link"><img src="assets/icons/login.png" alt="" />로그인</a>
    </div>
   </header>

   <main class="ob-main">
    <section class="ob-intro ob-intro-setup">
     <div class="ob-progress">
      <span class="is-active"></span><span class="is-active"></span><span></span>
     </div>
     <h1>이제 여행을 준비할 시간이에요</h1>
     <p>목적지, 여행 기간, 인원을 알려주시면 AI가 취향에 맞춘 추천 여행을 보여드려요.</p>

     <div class="ob-picked">
      <p class="ob-picked-label"><img src="assets/icons/check.png" alt="" />선택한 취향</p>
      <p class="ob-picked-value">맛집 & 미식, 역사 & 예술</p>
     </div>

     <div class="ob-setup-image"><img src="assets/images/travel.png" alt="여행 준비 이미지" /></div>
    </section>

    <section class="ob-form-card">
     <label class="ob-field">
      <span>어디로 떠나고 싶으세요?</span>
      <span class="ob-input-wrap"><img src="assets/icons/place-sm.png" alt="" /><input type="text" value="예: 동남아 휴양지의 조용한 바다" /></span>
      <small>국가, 도시, 또는 원하는 분위기를 자유롭게 입력해 주세요.</small>
     </label>

     <div class="ob-field-row">
      <label class="ob-field">
       <span>여행 기간</span>
       <span class="ob-input-wrap"><img src="assets/icons/calendar-md.png" alt="" /><input type="text" value="1주일" /></span>
      </label>
      <label class="ob-field">
       <span>여행 인원</span>
       <span class="ob-input-wrap"><img src="assets/icons/people.png" alt="" /><input type="text" value="2명(커플)" /></span>
      </label>
     </div>

     <a href="recommend.html" class="ob-reco-btn"><img src="assets/icons/generate.png" alt="" />AI 추천 받기<img src="assets/icons/arrow-right-white.png" alt="" /></a>
     <a href="home.html" class="ob-skip">홈으로 이동</a>
    </section>
   </main>
  </div>
   <script src="js/script.js" defer></script>
 </body>
</html>
